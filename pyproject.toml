[project]
name = "sebastian"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kerem Erdem", email = "73915500+ikeremerdem@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sebastian = "sebastian:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
