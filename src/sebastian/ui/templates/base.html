<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sebastian{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if nav != '/login' %}
<header class="top"><div class="in">
  <a class="brand" href="/">Sebastian</a>
  <nav>
    <a href="/" class="{{ 'on' if nav == '/' }}">Today</a>
    <a href="/tasks" class="{{ 'on' if nav.startswith('/tasks') }}">Tasks</a>
    <a href="/series" class="{{ 'on' if nav.startswith('/series') }}">Recurring</a>
    <a href="/entries" class="{{ 'on' if nav.startswith('/entries') }}">Logs &amp; notes</a>
    <a href="/categories" class="{{ 'on' if nav.startswith('/categories') }}">Categories</a>
    <a href="/settings" class="{{ 'on' if nav.startswith('/settings') }}">Settings</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="small">Log out</button></form>
</div></header>
{% endif %}
<main>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
