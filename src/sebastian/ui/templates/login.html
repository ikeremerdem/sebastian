{% extends "base.html" %}
{% block title %}Sebastian · Log in{% endblock %}
{% block content %}
<div class="login card">
  <h1>Sebastian</h1>
  <p class="muted">At your service.</p>
  {% if not configured %}
    <p class="flash error">No UI password is set. Run <code>sebastian hash-password</code> and put the result in <code>SEBASTIAN_UI_PASSWORD_HASH</code>.</p>
  {% else %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="f">Password<input type="password" name="password" autofocus required></label>
    <p><button class="primary">Log in</button></p>
  </form>
  {% endif %}
</div>
{% endblock %}
