{% extends "base.html" %}
{% from "_macros.html" import icon, hidden with context %}
{% block title %}Sebastian · Settings{% endblock %}
{% block content %}
<div class="page-head"><div class="grow"><h1>Settings</h1><div class="sub">Defaults used for due times and nagging.</div></div></div>
<form method="post" action="/settings" class="card pad">{{ hidden('/settings') }}
  <div class="form-grid">
    <label class="field">Timezone<input name="timezone" value="{{ eff.timezone }}"><span class="hint">IANA name, e.g. Europe/Berlin. Used for due times, quiet hours and what counts as a “day”.</span></label>
    <label class="field">Default nag interval (min)<input name="default_nag_interval_min" value="{{ eff.default_nag_interval_min }}" inputmode="numeric"><span class="hint">Minutes between reminders for an open task.</span></label>
    <label class="field span2">Quiet hours<input name="quiet_hours" value="{{ eff.quiet_hours }}"><span class="hint">Local window with no nags, e.g. 22:00-07:00, or “none”. Nagging resumes when it ends. Tasks and series can override this.</span></label>
  </div>
  <div class="actions" style="margin-top:16px"><button class="primary">Save settings</button></div>
</form>
{% endblock %}
